version: '3'

services:
  postgres:
    image: postgres:14
    container_name: postgres_challenges
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employee_db
    ports:
      - "5432:5432"
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d

  pgweb:
    image: sosedoff/pgweb
    container_name: pgweb_challenges
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/employee_db?sslmode=disable
    ports:
      - "8080:8081"
    depends_on:
      - postgres
